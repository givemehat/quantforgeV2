version: "3.8"
services:
  quant-forge:
    build: .
    ports:
      - "8501:8501"
    environment:
      - IBMQ_TOKEN=${IBMQ_TOKEN:-}
    volumes:
      - ./quant_forge.db:/app/quant_forge.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
